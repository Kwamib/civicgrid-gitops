# PodYard: a read-only dashboard that runs on Anansi (outside the cluster).
# This is everything it may do: look, never change. No secrets, no writes,
# no exec into pods. Its token lives in the Secret below; Kubernetes fills
# it in. Rotate by deleting the Secret (ArgoCD recreates it, new token).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podyard
  namespace: podyard
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: podyard-token
  namespace: podyard
  annotations:
    kubernetes.io/service-account.name: podyard
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podyard-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Logs are fetched only when someone clicks "View logs" for one pod.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Live CPU and memory (metrics-server).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # ArgoCD sync and health status.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podyard-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podyard-readonly
subjects:
  - kind: ServiceAccount
    name: podyard
    namespace: podyard
