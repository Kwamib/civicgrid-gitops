apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podyard-access
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Kwamib/civicgrid-gitops.git
    targetRevision: main
    path: infra/podyard
    directory:
      include: '*.yaml'
      exclude: application.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: podyard

  # The token controller fills in the Secret's data; that is not drift.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: podyard-token
      jsonPointers:
        - /data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
