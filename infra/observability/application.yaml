apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        prometheus:
          prometheusSpec:
            # Oct 17, 2026: OOMKilled for 9 days (2,012 restarts) while replaying
            # its write-ahead log at the 512Mi limit; each crash left a bigger log
            # (2,033 segments), so it could never catch up, and with Prometheus
            # down no alert reached Slack. Fix: more headroom for replay, less
            # data kept. A limit reserves nothing, so this barely affects
            # scheduling (request +64Mi).
            retention: 3d
            retentionSize: 1GB
            resources:
              requests:
                cpu: 100m
                memory: 320Mi
              limits:
                memory: 1Gi
            storageSpec: {}
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false

        alertmanager:
          alertmanagerSpec:
            # Secret created by hand (kubectl), never in Git. Mounted at
            # /etc/alertmanager/secrets/alertmanager-slack/url
            secrets:
              - alertmanager-slack
              # Healthchecks.io ping URL for the Watchdog heartbeat (also made
              # by hand). Mounted at /etc/alertmanager/secrets/alertmanager-heartbeat/url
              - alertmanager-heartbeat
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
          # Until Oct 8, 2026 every alert went to the "null" receiver (nowhere),
          # which is why the Oct 4-7 webhook-drain outage went unnoticed.
          config:
            route:
              receiver: slack
              group_by: [namespace, alertname]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Watchdog always fires while Prometheus and Alertmanager work.
                # Forwarding it every 5 minutes to Healthchecks.io (outside the
                # cluster) is the dead-man's switch: if pings stop, Healthchecks
                # alerts. Prometheus was down 9 days unnoticed before this (Oct 2026).
                - matchers: ['alertname = "Watchdog"']
                  receiver: heartbeat
                  group_wait: 0s
                  group_interval: 1m
                  repeat_interval: 5m
                - matchers: ['alertname = "InfoInhibitor"']
                  receiver: "null"
                - matchers: ['severity = "info"']
                  receiver: "null"
            receivers:
              - name: "null"
              - name: heartbeat
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/alertmanager-heartbeat/url
                    send_resolved: false
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                    text: |-
                      {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Annotations.summary }}{{ if .Labels.namespace }} (namespace: {{ .Labels.namespace }}){{ end }}
                      {{ .Annotations.description }}
                      {{ end }}

        grafana:
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          persistence:
            enabled: false
          defaultDashboardsEnabled: true

        prometheusOperator:
          admissionWebhooks:
            enabled: true
            certManager:
              enabled: true

        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true

        kubeProxy:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true