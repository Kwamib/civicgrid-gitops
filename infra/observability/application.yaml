apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        prometheus:
          prometheusSpec:
            retention: 7d
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            storageSpec: {}
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false

        alertmanager:
          alertmanagerSpec:
            # Secret created by hand (kubectl), never in Git. Mounted at
            # /etc/alertmanager/secrets/alertmanager-slack/url
            secrets:
              - alertmanager-slack
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
          # Until Oct 8, 2026 every alert went to the "null" receiver (nowhere),
          # which is why the Oct 4-7 webhook-drain outage went unnoticed.
          config:
            route:
              receiver: slack
              group_by: [namespace, alertname]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                - matchers: ['alertname = "Watchdog"']
                  receiver: "null"
                - matchers: ['alertname = "InfoInhibitor"']
                  receiver: "null"
                - matchers: ['severity = "info"']
                  receiver: "null"
            receivers:
              - name: "null"
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                    text: |-
                      {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Annotations.summary }}{{ if .Labels.namespace }} (namespace: {{ .Labels.namespace }}){{ end }}
                      {{ .Annotations.description }}
                      {{ end }}

        grafana:
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          persistence:
            enabled: false
          defaultDashboardsEnabled: true

        prometheusOperator:
          admissionWebhooks:
            enabled: true
            certManager:
              enabled: true

        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true

        kubeProxy:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true