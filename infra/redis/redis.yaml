# Shared rate-limit counters for civicgrid-api (REDIS_URL). Counters only:
# no persistence, nothing here needs a backup. If this pod restarts, limits
# reset for up to a minute; if it is down, the API keeps serving and counts
# per pod (FailOpenBackend in app/rate_limit.py).
#
# Replaces the Bitnami chart that stopped resolving in Aug 2025.
# Image: redis 7.2 line (BSD license).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicgrid-redis
  labels:
    app.kubernetes.io/name: civicgrid-redis
    app.kubernetes.io/part-of: civicgrid
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: civicgrid-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicgrid-redis
        app.kubernetes.io/part-of: civicgrid
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2.7-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 40mb
            - --maxmemory-policy
            - allkeys-lru
            # Reachable only inside the cluster, and the NetworkPolicy below
            # admits only API pods.
            - --protected-mode
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: civicgrid-redis
  labels:
    app.kubernetes.io/name: civicgrid-redis
spec:
  selector:
    app.kubernetes.io/name: civicgrid-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Only the API pods may talk to Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicgrid-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: civicgrid-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: civicgrid-api
      ports:
        - port: 6379
          protocol: TCP
