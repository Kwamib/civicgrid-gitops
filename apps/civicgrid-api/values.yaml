image:
  # Pin to an immutable CI tag (sha-<7-char commit>). Rollback = revert this commit.
  tag: "sha-1fdb037"
  pullPolicy: IfNotPresent

database:
  url: ""
  existingSecret: civicgrid-database
  existingSecretKey: DATABASE_URL

replicaCount: 1
autoscaling:
  enabled: true
  # Back to 1 (Oct 8): 2 replicas pushed node memory requests to 97% and the
  # webhook-drain CronJob couldn't schedule. Revisit after reclaiming memory.
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

# Enable Prometheus scraping
serviceMonitor:
  enabled: true
  interval: 30s

# Admin token Secret created by Terraform in civicgrid-infra
admin:
  existingSecret: civicgrid-admin
  existingSecretKey: ADMIN_TOKEN

# Shared rate-limit counters for all API pods (since Oct 11, 2026). Redis runs
# in-cluster from infra/redis (Deployment civicgrid-redis, no persistence).
# If Redis is down the API falls back to per-pod counting; it never fails requests.
redis:
  url: "redis://civicgrid-redis.civicgrid.svc.cluster.local:6379/0"

# Supabase JWT secret for /me endpoints (created by Terraform in civicgrid-admin secret)
jwt:
  existingSecret: civicgrid-admin
  existingSecretKey: SUPABASE_JWT_SECRET

webhookDrain:
  enabled: true
