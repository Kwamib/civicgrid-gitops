image:
  # Pinned to the digest running before the Oct 7 node reboot (pre-PR #25 code).
  tag: "latest@sha256:2e3c10460ef26e76999c074f0124a4714a77213096e96799322d5e1774db5a10"
  pullPolicy: IfNotPresent

database:
  url: ""
  existingSecret: civicgrid-database
  existingSecretKey: DATABASE_URL

replicaCount: 1
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

# Enable Prometheus scraping
serviceMonitor:
  enabled: true
  interval: 30s

# Admin token Secret created by Terraform in civicgrid-infra
admin:
  existingSecret: civicgrid-admin
  existingSecretKey: ADMIN_TOKEN

# Redis disabled for now — Bitnami chart URL no longer resolves after their
# August 2025 catalog restructure. Rate limiter falls back to in-memory mode.
# This is fine for single-pod; if/when we scale we'll deploy Redis another way.
redis:
  url: ""

# Supabase JWT secret for /me endpoints (created by Terraform in civicgrid-admin secret)
jwt:
  existingSecret: civicgrid-admin
  existingSecretKey: SUPABASE_JWT_SECRET

webhookDrain:
  enabled: true
